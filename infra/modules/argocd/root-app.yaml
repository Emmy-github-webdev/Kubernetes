apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: root-app
  namespace: "${var.tags.project}-${var.tags.environment}-argocd"

spec:
  project: default

  source:
    repoURL: https://github.com/company/gitops-repo.git
    targetRevision: main
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: "${var.tags.project}-${var.tags.environment}-argocd"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true