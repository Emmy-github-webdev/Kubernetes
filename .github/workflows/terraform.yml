name: Terraform CI/CD

on:
  push:
    branches:
      - develop
      - staging
      - main
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - staging
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - shared
          - dev
          - staging
          - prod

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:

  #################################################
  # DETERMINE TERRAFORM ENVIRONMENT
  #################################################

  determine-env:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.setenv.outputs.environment }}
      tf_action: ${{ steps.setenv.outputs.tf_action }}

    steps:

      - name: Determine Environment
        id: setenv
        shell: bash
        run: |

          #################################################
          # MANUAL WORKFLOW
          #################################################

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            echo "Manual workflow detected"

            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "tf_action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"

            echo "Environment: ${{ inputs.environment }}"
            echo "Action: ${{ inputs.action }}"

            exit 0
          fi


          #################################################
          # PULL REQUEST
          #################################################

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then

            SOURCE_BRANCH="${{ github.head_ref }}"
            TARGET_BRANCH="${{ github.base_ref }}"

            echo "Pull request detected"
            echo "Source branch: ${SOURCE_BRANCH}"
            echo "Target branch: ${TARGET_BRANCH}"

            case "$TARGET_BRANCH" in

              develop)
                echo "environment=dev" >> "$GITHUB_OUTPUT"
                echo "tf_action=plan" >> "$GITHUB_OUTPUT"
                ;;

              staging)
                echo "environment=staging" >> "$GITHUB_OUTPUT"
                echo "tf_action=plan" >> "$GITHUB_OUTPUT"
                ;;

              main)
                echo "environment=prod" >> "$GITHUB_OUTPUT"
                echo "tf_action=plan" >> "$GITHUB_OUTPUT"
                ;;

              *)
                echo "Unsupported PR target branch: ${TARGET_BRANCH}"
                exit 1
                ;;

            esac

            exit 0
          fi


          #################################################
          # PUSH
          #################################################

          BRANCH="${GITHUB_REF#refs/heads/}"

          echo "Push detected"
          echo "Branch: ${BRANCH}"

          case "$BRANCH" in

            develop)

              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "tf_action=apply" >> "$GITHUB_OUTPUT"
              ;;

            staging)

              echo "environment=staging" >> "$GITHUB_OUTPUT"
              echo "tf_action=apply" >> "$GITHUB_OUTPUT"
              ;;

            main)

              echo "environment=prod" >> "$GITHUB_OUTPUT"
              echo "tf_action=apply" >> "$GITHUB_OUTPUT"
              ;;

            feature/*)

              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "tf_action=plan" >> "$GITHUB_OUTPUT"
              ;;

            *)

              echo "Unsupported branch: ${BRANCH}"
              exit 1
              ;;

          esac


  #################################################
  # TERRAFORM
  #################################################

  terraform:
    needs: determine-env

    uses: ./.github/workflows/reusable-terraform.yml

    with:
      environment: ${{ needs.determine-env.outputs.environment }}
      tf_action: ${{ needs.determine-env.outputs.tf_action }}

    secrets: inherit