name: Terraform CI/CD

on:
  push:
    branches:
      - develop
      - staging
      - main
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - staging
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - shared
          - dev
          - staging
          - prod

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write
  security-events: write

jobs:

  determine-env:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.setenv.outputs.environment }}
      tf_action: ${{ steps.setenv.outputs.tf_action }}

    steps:

      - id: setenv
        run: |

          #################################################
          # MANUAL WORKFLOW
          #################################################

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"

            echo "tf_action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          #################################################
          # AUTOMATIC WORKFLOW
          #################################################

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "tf_action=${{ github.event.inputs.action }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"

          case "$BRANCH" in

            develop)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "tf_action=apply" >> "$GITHUB_OUTPUT"
              ;;

            staging)
              echo "environment=staging" >> "$GITHUB_OUTPUT"
              echo "tf_action=apply" >> "$GITHUB_OUTPUT"
              ;;

            main)
              echo "environment=prod" >> "$GITHUB_OUTPUT"
              echo "tf_action=apply" >> "$GITHUB_OUTPUT"
              ;;

            feature/*)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "tf_action=plan" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Unsupported branch: $BRANCH"
              exit 1
              ;;

          esac

          #################################################
          # TERRAFORM ACTION
          #################################################

          if [[ "$BRANCH" == "develop" ||
                "$BRANCH" == "staging" ||
                "$BRANCH" == "main" ]]; then

            echo "tf_action=apply" >> "$GITHUB_OUTPUT"

          else

            echo "tf_action=plan" >> "$GITHUB_OUTPUT"

          fi

  terraform:
    needs: determine-env

    uses: ./.github/workflows/reusable-terraform.yml

    with:
      environment: ${{ needs.determine-env.outputs.environment }}
      tf_action: ${{ needs.determine-env.outputs.tf_action }}

    secrets: inherit